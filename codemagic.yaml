# 复刻版 App 壳：Codemagic 编未签名 IPA（用户自己签名安装），与 GitHub Actions 工作流同步骤。
# 注意：Codemagic 的 Mac mini M2 镜像自带 Xcode 但不带 Rust，编 AirliftFFI 之前必须先装 rustup。
workflows:
  ios-unsigned:
    name: WalliveClone unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Unpack rust-core
        script: unzip -o rust-core.zip && ls rust-core
      - name: Install Rust toolchain
        script: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          source "$HOME/.cargo/env" || true
          rustup target add aarch64-apple-ios
      - name: Build AirliftFFI (device only)
        script: bash build-airlift.sh
      - name: Resolve package dependencies
        script: xcodebuild -resolvePackageDependencies -project WalliveClone.xcodeproj -scheme WalliveClone
      - name: Stamp build number into version tag
        script: |
          # 探针 3 版：固定盖戳，不走 03 号的 SEQ 公式（03 号的公式
          # BUILD_NUMBER - 32 留在 main 上别动，探针编包时不要用它，
          # 探针编完、下次再编正常版时记得确认这行已经改回 SEQ 公式。）
          TAG="V6·1107-探针3"
          printf 'import Foundation\n\nenum BuildInfo {\n    static let tag = "%s"\n}\n' "$TAG" > App/BuildInfo.swift
          cat App/BuildInfo.swift
      - name: Archive (unsigned)
        script: xcodebuild archive -project WalliveClone.xcodeproj -scheme WalliveClone -configuration Release -destination "generic/platform=iOS" -archivePath build/WalliveClone.xcarchive CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        script: |
          APP_PATH="build/WalliveClone.xcarchive/Products/Applications/WalliveClone.app"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload WalliveClone-unsigned.ipa
          ls -l WalliveClone-unsigned.ipa
    artifacts:
      - WalliveClone-unsigned.ipa
