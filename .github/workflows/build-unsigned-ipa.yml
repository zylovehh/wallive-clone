# 复刻版 App 壳：macOS runner 编译未签名 IPA（用户自己签名安装）。
# 要求：把 win97/ 目录内容作为仓库根推送（本文件位于仓库根 .github/workflows/ 下）。
# 产物：Win97-unsigned-ipa（未签名 IPA），不含任何证书/签名步骤。

name: 编译未签名 IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unpack rust-core
        run: unzip -o rust-core.zip && ls rust-core

      - name: Build AirliftFFI (device only)
        run: bash build-airlift.sh

      - name: Resolve package dependencies
        run: >
          xcodebuild -resolvePackageDependencies
          -project Win97.xcodeproj
          -scheme Win97

      - name: Archive (unsigned)
        run: >
          xcodebuild archive
          -project Win97.xcodeproj
          -scheme Win97
          -configuration Release
          -destination "generic/platform=iOS"
          -archivePath build/Win97.xcarchive
          CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Win97.xcarchive/Products/Applications/Win97.app"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Win97-unsigned.ipa
          ls -l Win97-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Win97-unsigned-ipa
          path: Win97-unsigned.ipa
